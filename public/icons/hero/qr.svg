<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="qr_bg" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF6B00"/>
      <stop offset="1" stop-color="#FF9E00"/>
    </linearGradient>
    <linearGradient id="qr_corner" x1="14" y1="14" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFE8D6"/>
    </linearGradient>
    <filter id="qr_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#FF6B00" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Base Rounded Scanner Card -->
  <rect x="8" y="8" width="48" height="48" rx="14" fill="url(#qr_bg)" filter="url(#qr_shadow)"/>
  
  <!-- Scanner Corners -->
  <rect x="14" y="14" width="14" height="14" rx="4" fill="url(#qr_corner)"/>
  <rect x="17.5" y="17.5" width="7" height="7" rx="2" fill="#FF6B00"/>
  
  <rect x="36" y="14" width="14" height="14" rx="4" fill="url(#qr_corner)"/>
  <rect x="39.5" y="17.5" width="7" height="7" rx="2" fill="#FF6B00"/>
  
  <rect x="14" y="36" width="14" height="14" rx="4" fill="url(#qr_corner)"/>
  <rect x="17.5" y="39.5" width="7" height="7" rx="2" fill="#FF6B00"/>
  
  <!-- QR Modules -->
  <rect x="36" y="36" width="6" height="6" rx="2" fill="#FFFFFF"/>
  <rect x="44" y="36" width="6" height="6" rx="2" fill="#FFFFFF"/>
  <rect x="36" y="44" width="6" height="6" rx="2" fill="#FFFFFF"/>
  <rect x="44" y="44" width="6" height="6" rx="2" fill="#FFE8D6"/>
  
  <!-- Laser Beam Highlight -->
  <rect x="10" y="31" width="44" height="3" rx="1.5" fill="#FFFFFF" opacity="0.9"/>
</svg>
