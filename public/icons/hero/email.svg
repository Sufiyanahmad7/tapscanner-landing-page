<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="env_body" x1="8" y1="16" x2="56" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="env_flap" x1="8" y1="16" x2="32" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="env_badge" x1="42" y1="10" x2="56" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF4D4D"/>
      <stop offset="1" stop-color="#F43F5E"/>
    </linearGradient>
    <filter id="env_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#0284C7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Envelope Body -->
  <rect x="8" y="16" width="48" height="34" rx="10" fill="url(#env_body)" filter="url(#env_shadow)"/>
  
  <!-- Inner Letter Sheet -->
  <path d="M14 20H50V40H14V20Z" fill="#FFFFFF" opacity="0.95"/>
  <rect x="18" y="24" width="20" height="3" rx="1.5" fill="#38BDF8"/>
  <rect x="18" y="30" width="14" height="3" rx="1.5" fill="#BAE6FD"/>

  <!-- Top Folded Flap -->
  <path d="M8 20L30.5 35.2C31.4 35.8 32.6 35.8 33.5 35.2L56 20V18C56 14.6863 53.3137 12 50 12H14C10.6863 12 8 14.6863 8 18V20Z" fill="url(#env_flap)"/>
  
  <!-- Notification Red Badge -->
  <circle cx="48" cy="16" r="8" fill="url(#env_badge)"/>
  <circle cx="48" cy="16" r="3" fill="#FFFFFF"/>
</svg>
